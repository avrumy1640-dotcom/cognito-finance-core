name: RLS & webhook tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  supabase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Write .env for tests
        run: |
          cat >> .env <<EOF
          SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)
          SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)
          SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)
          IBERBANCO_WEBHOOK_SECRET=${{ secrets.IBERBANCO_WEBHOOK_SECRET || 'ci-test-secret-please-override-in-repo-secrets' }}
          EOF
      - name: RLS integration tests
        run: deno test --allow-all supabase/functions/rls-tests/index.test.ts
      - name: Webhook signature + idempotency tests
        run: deno test --allow-all supabase/functions/iberbanco-webhook/
